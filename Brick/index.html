main{max-width:980px;margin:0 auto;padding:28px 18px 48px}
h1{font:700 clamp(2rem,6vw,3rem)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:0 0 6px;letter-spacing:.01em}
.lede{margin:0 0 14px;color:var(--muted);max-width:56ch}
.ig{display:inline-block;margin:0 0 24px;padding:8px 14px;border-radius:4px;background:var(--brick);color:var(--brick-ink);font-weight:600;text-decoration:none}
.ig:hover{filter:brightness(1.12);text-decoration:underline}
.ig:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.intro{min-width:0}
.logo{flex:none;display:block;width:clamp(110px,22vw,200px);height:auto;border-radius:14px}
@media (max-width:559px){.top{flex-direction:column-reverse;gap:14px}.logo{width:120px}}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:820px){.grid{grid-template-columns:1.15fr .85fr;align-items:start}.result{position:sticky;top:18px}}
.result{order:-1;background:var(--lush);color:var(--brick-ink);border-radius:6px;padding:22px 22px 18px;
  background-image:
    linear-gradient(var(--mortar) 2px,transparent 2px),
    linear-gradient(90deg,var(--mortar) 2px,transparent 2px),
    linear-gradient(90deg,var(--mortar) 2px,transparent 2px);
  background-size:100% 28px,56px 56px,56px 56px;
  background-position:0 0,0 0,28px 28px;
  background-repeat:repeat,repeat-x,repeat-x;
}
@media (min-width:820px){.result{order:0}}
.big{font:700 clamp(3.4rem,13vw,5.6rem)/1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;margin:2px 0 2px;font-variant-numeric:tabular-nums}
.big-label{margin:0;font-weight:500}
.order{margin:10px 0 0;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:4px;display:none}
.order strong{font-size:1.15rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 18px 18px}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:16px 0 0}
fieldset:first-of-type{border-top:0}
legend{font-weight:600;font-size:1.05rem;padding:14px 0 0;float:left;width:100%;margin-bottom:12px}
fieldset>.row{clear:both}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
label{display:block;font-size:.9rem;color:var(--muted)}
.f{display:flex;align-items:center;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.f:focus-within{outline:2px solid var(--focus);outline-offset:1px}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.05rem;padding:9px 10px;outline:none}
.u{padding:0 10px;color:var(--muted);font-size:.85rem;white-space:nowrap}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="intro">
  <h1>Brick calculator</h1>
  <p class="lede">Enter your brick size and wall details to see how many bricks the job needs. Everything is worked out in your browser as you type.</p>

  <div class="grid">
    <form class="panel" onsubmit="return false" autocomplete="off">
      <fieldset>
        <legend>Brick size</legend>
        <div class="row">
          <label>Length<span class="f"><input id="bl" type="number" inputmode="decimal" min="0" step="any" value="9"><span class="u">in</span></span></label>
          <label>Height<span class="f"><input id="bh" type="number" inputmode="decimal" min="0" step="any" value="4"><span class="u">in</span></span></label>
          <label>Width<span class="f"><input id="bw" type="number" inputmode="decimal" min="0" step="any" value="3"><span class="u">in</span></span></label>
          
          <label>Mortar thickness<span class="f"><input id="mt" type="number" inputmode="decimal" min="0" step="any" value="0.5"><span class="u">in</span></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Wall</legend>
        <div class="row">
          <label>Wall height<span class="f"><input id="wh" type="number" inputmode="decimal" min="0" step="any" value="10"><span class="u">ft</span></span></label>
          <label>Wall thickness<span class="f"><input id="wt" type="number" inputmode="decimal" min="0" step="any" value="9"><span class="u">in</span></span></label>
          <label>Running length<span class="f"><input id="wl" type="number" inputmode="decimal" min="0" step="any" value="177"><span class="u">ft</span></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Openings</legend>
        <div class="row">
          <label>Windows, total area<span class="f"><input id="win" type="number" inputmode="decimal" min="0" step="any" value="174"><span class="u">sq ft</span></span></label>
          <label>Doors, total area<span class="f"><input id="door" type="number" inputmode="decimal" min="0" step="any" value="70"><span class="u">sq ft</span></span></label>
        </div>
      </fieldset>
      <fieldset>
        <legend>Extra</legend>
        <div class="row">
          <label>Wastage allowance<span class="f"><input id="waste" type="number" inputmode="decimal" min="0" step="any" value="0"><span class="u">%</span></span></label>
        </div>
      </fieldset>
    </form>

    <section class="result" aria-live="polite">
      <p class="big-label">Bricks needed</p>
      <div class="big" id="bricks">0</div>
      <p class="order" id="orderBox">With wastage, order <strong id="ordered">0</strong></p>
    </section>
  </div>
</main>
<script>
(function(){
  var ids=["bl","bh","bw","mt","wh","wt","wl","win","door","waste"],el={};
  ids.forEach(function(i){el[i]=document.getElementById(i);el[i].addEventListener("input",calc);});
  function v(i){var n=parseFloat(el[i].value);return isFinite(n)&&n>0?n:0;}
  function f(n,d){return n.toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});}
  function set(i,t){document.getElementById(i).textContent=t;}
  function calc(){
    var brickVol=(v("bl")/12)*((v("bh")+v("mt"))/12)*((v("bw")+v("mt"))/12);
    var t=v("wt")/12;
    var wall=v("wh")*t*v("wl");
    var open=(v("win")+v("door"))*t;
    var net=Math.max(0,wall-open);
    var count=brickVol>0?Math.ceil(net/brickVol-1e-9):0;
    var w=v("waste"),ordered=Math.ceil(count*(1+w/100));
    set("bricks",f(count,0));
    document.getElementById("orderBox").style.display=w>0?"block":"none";
    set("ordered",f(ordered,0));
  }
  calc();
})();
</script>
